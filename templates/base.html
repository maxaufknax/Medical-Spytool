<!DOCTYPE html>
<html lang="de" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Medical Spytool{% endblock %}</title>
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.replit.com/agent/bootstrap-agent-dark-theme.min.css">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
    
    <style>
        .navbar-brand {
            font-weight: bold;
        }
        
        .nav-link {
            padding: 0.5rem 1rem;
        }
        
        .footer {
            margin-top: 3rem;
            padding: 1.5rem 0;
            border-top: 1px solid var(--bs-border-color);
        }
        
        .search-container {
            max-width: 900px;
            margin: 0 auto;
        }
        
        .section-title {
            margin-bottom: 1.5rem;
            border-bottom: 2px solid var(--bs-border-color);
            padding-bottom: 0.5rem;
        }
        
        .form-label {
            font-weight: 500;
        }
        
        .card {
            margin-bottom: 1.5rem;
        }
        
        .table-responsive {
            margin-bottom: 2rem;
        }
        
        .bg-lighter {
            background-color: rgba(255, 255, 255, 0.05);
        }
        
        .loading-indicator {
            display: none;
            text-align: center;
            margin: 2rem 0;
        }
        
        .spinner-border {
            width: 3rem;
            height: 3rem;
        }
        
        /* Person Autocomplete Styles */
        .person-autocomplete-wrapper {
            position: relative;
        }
        .person-autocomplete-items {
            position: absolute;
            border: 1px solid var(--bs-gray-700);
            border-top: none;
            z-index: 99;
            top: 100%;
            left: 0;
            right: 0;
            max-height: 300px;
            overflow-y: auto;
            background-color: var(--bs-dark);
            border-radius: 0 0 4px 4px;
        }
        .person-autocomplete-items div {
            padding: 10px 15px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .person-autocomplete-items div:hover {
            background-color: var(--bs-gray-700);
        }
        .person-autocomplete-active {
            background-color: var(--bs-primary) !important; 
            color: #ffffff;
        }
        .person-details {
            font-size: 0.85em;
            color: var(--bs-gray-500);
            margin-top: 3px;
        }
    </style>
    
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">Medical Spytool</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/"><i class="fas fa-home"></i> Start</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if '/search' in request.path %}active{% endif %}" href="/search"><i class="fas fa-search"></i> Suche</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if '/persons' in request.path %}active{% endif %}" href="/persons"><i class="fas fa-users"></i> Personen</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if '/results' in request.path %}active{% endif %}" href="/results"><i class="fas fa-list"></i> Ergebnisse</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if '/analysis' in request.path %}active{% endif %}" href="/analysis"><i class="fas fa-chart-bar"></i> Analyse</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if '/export' in request.path %}active{% endif %}" href="/export"><i class="fas fa-file-export"></i> Export</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link {% if '/logs' in request.path %}active{% endif %}" href="/logs"><i class="fas fa-clipboard-list"></i> Logs</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if '/settings' in request.path %}active{% endif %}" href="/settings"><i class="fas fa-cog"></i> Einstellungen</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <!-- Footer -->
    <footer class="footer mt-5">
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <p>&copy; {{ now.year }} Medical Spytool</p>
                </div>
                <div class="col-md-6 text-md-end">
                    <p>Version 1.0</p>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap JavaScript Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    
    {% block scripts %}{% endblock %}
</body>
</html>
