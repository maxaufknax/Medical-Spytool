{% extends 'base.html' %}

{% block title %}Medical Spytool - Fehler{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card border-danger">
                <div class="card-header bg-danger text-white">
                    <h4 class="mb-0">
                        <i class="fas fa-exclamation-triangle me-2"></i>
                        {{ error }}
                    </h4>
                </div>
                <div class="card-body">
                    <p class="lead mb-4">{{ message }}</p>
                    
                    <div class="d-flex justify-content-between align-items-center">
                        <a href="{{ url_for('index') }}" class="btn btn-primary">
                            <i class="fas fa-home me-2"></i>Zur Startseite
                        </a>
                        
                        <a href="{{ url_for('logs') }}" class="btn btn-outline-secondary">
                            <i class="fas fa-clipboard-list me-2"></i>Logs anzeigen
                        </a>
                    </div>
                </div>
            </div>
            
            <div class="mt-4">
                <h5>Hilfreiche Links</h5>
                <ul class="list-unstyled">
                    <li>
                        <a href="{{ url_for('search') }}">
                            <i class="fas fa-search me-2"></i>Neue Suche starten
                        </a>
                    </li>
                    <li class="mt-2">
                        <a href="{{ url_for('settings') }}">
                            <i class="fas fa-cog me-2"></i>Einstellungen überprüfen
                        </a>
                    </li>
                    <li class="mt-2">
                        <a href="{{ url_for('info') }}">
                            <i class="fas fa-info-circle me-2"></i>Dokumentation
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</div>
{% endblock %}
