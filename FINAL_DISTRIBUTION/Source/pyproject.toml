[build-system]
requires = ["setuptools>=60", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-spytool"
version = "0.7.0"
description = "A powerful tool for searching and analyzing medical literature across multiple databases"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Medical Spytool Team", email = "contact@medicalspytool.com"}
]
keywords = ["medical", "literature", "pubmed", "research", "database"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.8"
dependencies = [
    "requests>=2.25.0",
    "beautifulsoup4>=4.9.0",
    "pandas>=1.3.0",
    "openpyxl>=3.0.0",
    "lxml>=4.6.0",
    "python-dateutil>=2.8.0",
    "tqdm>=4.60.0",
    "matplotlib>=3.3.0",
    "seaborn>=0.11.0",
    "numpy>=1.20.0",
    "biopython>=1.79",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.2.0",
    "pytest-cov>=3.0.0",
    "black>=21.0.0",
    "flake8>=3.9.0",
    "mypy>=0.900",
    "pyinstaller>=4.5",
]

[project.urls]
"Homepage" = "https://github.com/yourusername/Medical-Spytool"
"Bug Reports" = "https://github.com/yourusername/Medical-Spytool/issues"
"Source" = "https://github.com/yourusername/Medical-Spytool"
"Documentation" = "https://github.com/yourusername/Medical-Spytool/docs"

[project.scripts]
medical-spytool = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "dnb_spytool*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=medical_spytool --cov-report=html --cov-report=term-missing"

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
