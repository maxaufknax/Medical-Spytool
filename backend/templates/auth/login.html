{% extends "base.html" %}

{% block title %}MedicalSpy - Anmelden{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-5">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0"><i class="fas fa-sign-in-alt me-2"></i>Anmelden</h5>
                </div>
                <div class="card-body p-4">
                    <form method="post" action="{{ url_for('auth.login') }}" data-show-loading="true" data-loading-message="Anmeldung wird verarbeitet...">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                        <div class="mb-3">
                            <label for="username" class="form-label">Benutzername</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-user"></i></span>
                                <input type="text" class="form-control" id="username" name="username" required autofocus>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Passwort</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                <input type="password" class="form-control" id="password" name="password" required>
                            </div>
                        </div>
                        
                        <div class="mb-4 form-check">
                            <input type="checkbox" class="form-check-input" id="remember" name="remember">
                            <label class="form-check-label" for="remember">Angemeldet bleiben</label>
                        </div>
                        
                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fas fa-sign-in-alt me-2"></i>Anmelden
                            </button>
                        </div>
                          <div class="text-center">
                            <p class="mb-0">
                                Noch keinen Account? <a href="{{ url_for('auth.register') }}">Registrieren</a>
                            </p>
                            <p class="mt-2">
                                <a href="{{ url_for('auth.forgot_password') }}" class="text-muted">Passwort vergessen?</a>
                            </p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
