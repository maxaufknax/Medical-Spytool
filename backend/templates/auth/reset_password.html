{% extends "base.html" %}

{% block title %}Neues Passwort festlegen{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm mt-5">
                <div class="card-header bg-primary text-white">
                    <h2 class="h5 mb-0">Neues Passwort festlegen</h2>
                </div>
                <div class="card-body">
                    <form action="{{ url_for('auth.reset_password', token=token) }}" method="post">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                        
                        <div class="mb-4">
                            <p>Bitte legen Sie ein neues Passwort für Ihr Konto fest.</p>
                        </div>
                        
                        <div class="mb-3">
                            <label for="password" class="form-label">Neues Passwort</label>
                            <input type="password" class="form-control" id="password" name="password" required 
                                   pattern=".{8,}" title="Das Passwort muss mindestens 8 Zeichen lang sein">
                            <div class="form-text">Mindestens 8 Zeichen</div>
                        </div>
                        
                        <div class="mb-4">
                            <label for="confirm_password" class="form-label">Passwort bestätigen</label>
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                        </div>
                        
                        <div class="d-grid gap-2 mb-3">
                            <button type="submit" class="btn btn-primary">Passwort speichern</button>
                        </div>
                        
                        <div class="text-center">
                            <a href="{{ url_for('auth.login') }}" class="text-decoration-none">Zurück zur Anmeldung</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', () => {
    const password = document.getElementById('password');
    const confirmPassword = document.getElementById('confirm_password');
    
    // Function to check if passwords match
    function checkPasswordMatch() {
        if (confirmPassword.value && password.value !== confirmPassword.value) {
            confirmPassword.setCustomValidity('Die Passwörter stimmen nicht überein');
        } else {
            confirmPassword.setCustomValidity('');
        }
    }
    
    // Add event listeners
    password.addEventListener('input', checkPasswordMatch);
    confirmPassword.addEventListener('input', checkPasswordMatch);
});
</script>
{% endblock %}
