version: '3.8'

services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/medicalspy
      - SESSION_SECRET=dev_secret_change_in_production
      - LOG_LEVEL=INFO
    volumes:
      - ./logs:/app/logs
      - ./output:/app/output
      - ./person_lists:/app/person_lists
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:14-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=medicalspy
    ports:
      - "5432:5432"
    restart: unless-stopped

volumes:
  postgres_data: